name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC to AWS
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: merchants-survey
  APP_DIR: /opt/merchants-survey

jobs:
  deploy:
    # arm64 runner: the image must match the Graviton instance (t4g).
    # No `environment:` here: it changes the OIDC sub and breaks the deploy role's trust policy.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Unit tests
        run: |
          npm ci
          npm test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether this commit is already built
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          # The repo's compose file is the source of truth; ship it with the deploy (small, gzip+base64).
          # AWS-RunShellScript runs under /bin/sh (dash): keep these commands POSIX.
          COMPOSE_B64=$(gzip -9 -c docker-compose.yml | base64 -w0)

          PARAMS=$(jq -n --arg c "$COMPOSE_B64" --arg i "$IMAGE" --arg d "$APP_DIR" '{
            commands: [
              "set -eu",
              ("echo " + $c + " | base64 -d | gunzip > " + $d + "/docker-compose.yml.new"),
              ("mv " + $d + "/docker-compose.yml.new " + $d + "/docker-compose.yml"),
              ("/usr/local/bin/survey-deploy " + $i)
            ],
            executionTimeout: ["900"]
          }')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 190); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|Cancelling|TimedOut) break ;; esac
            sleep 5
          done

          echo "---- stdout"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "---- stderr"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true

          [ "$STATUS" = "Success" ] || { echo "deploy status: $STATUS" >&2; exit 1; }
