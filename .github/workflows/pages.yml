# Test copy of the survey on GitHub Pages. It saves nothing: config.js has no SUBMIT_URL,
# so the page runs in preview mode. Production is the EC2 server (deploy.yml).
name: pages

on:
  push:
    branches: [main]
    paths: [public/**, .github/workflows/pages.yml]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site (public/ plus a preview-mode config.js)
        run: |
          mkdir -p _site
          cp -a public/. _site/
          echo 'window.SURVEY_CONFIG = {SUBMIT_URL: "", TURNSTILE_SITE_KEY: ""};' > _site/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
