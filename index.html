<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foodics Survey</title>
<meta name="description" content="A five-minute survey on F&B trends, challenges and technology in the region.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Foodics">
<meta property="og:title" content="Foodics Survey">
<meta property="og:description" content="Your answers will help us better serve you. Takes about 5 minutes.">
<meta name="theme-color" content="#440099">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one question per screen on a Foodics-purple field. Fixed top progress, quiet header, thumb-reach dock at the bottom. */
:root{
  --brand:#440099;
  --brand-deep:#2a0066;
  --brand-glow:#5830c5;
  --lav:#cdb8ff;
  --paper:#ffffff;
  --glass:rgba(255,255,255,.10);
  --glass-hover:rgba(255,255,255,.18);
  --line:rgba(255,255,255,.26);
  --font-latin:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
  --gutter:clamp(16px,4vw,40px);
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;background:var(--brand-deep);color:var(--paper);
  font-family:var(--font-latin);font-size:17px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
}
html[lang="ar"] body{font-family:var(--font-ar)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:12px}

/* Background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(1100px 700px at 10% -10%,var(--brand-glow) 0%,transparent 62%),
    radial-gradient(900px 640px at 108% 108%,#6a2de0 0%,transparent 58%),
    linear-gradient(160deg,var(--brand) 0%,var(--brand-deep) 100%);}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.32;animation:drift 24s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;background:#7b4dff;top:-18vmax;inset-inline-end:-12vmax}
.b2{width:40vmax;height:40vmax;background:#3b0aa8;bottom:-16vmax;inset-inline-start:-10vmax;animation-duration:30s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-4vmax,5vmax,0) scale(1.12)}}

/* Progress + header */
.progress{position:fixed;top:0;inset-inline:0;height:4px;background:rgba(255,255,255,.14);z-index:30;display:flex}
#bar{height:100%;width:0;background:#fff;border-radius:0 4px 4px 0;transition:width .6s var(--ease)}
[dir="rtl"] #bar{border-radius:4px 0 0 4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(20px + env(safe-area-inset-top,0px)) var(--gutter) 8px;position:relative;z-index:5}
.logo{display:flex;align-items:center;min-height:32px;text-decoration:none;color:#fff}
.logo img{height:26px;width:auto;filter:brightness(0) invert(1)}
.wordmark{font-weight:700;letter-spacing:.22em;font-size:20px;font-family:var(--font-latin)}
.tools{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--lav)}
.lang{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px;transition:background .2s}
.lang:hover{background:var(--glass-hover)}

/* Stage */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:12px var(--gutter) 150px}
.screen{width:100%;max-width:760px}
.anim-fwd{animation:inFwd .42s var(--ease) both}
.anim-back{animation:inBack .42s var(--ease) both}
.anim-none{animation:none}
@keyframes inFwd{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}

.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--lav)}
html[lang="ar"] .chip{letter-spacing:0;text-transform:none;font-size:14px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lav)}
.chip.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%{transform:translateX(-10px);opacity:0}30%{opacity:1}100%{transform:none}}
[dir="rtl"] .chip.flash{animation-name:flashR}
@keyframes flashR{0%{transform:translateX(10px);opacity:0}30%{opacity:1}100%{transform:none}}
.count{font-size:14px;color:var(--lav);font-variant-numeric:tabular-nums}

h1.q{margin:0 0 10px;font-size:clamp(26px,4.4vw,42px);line-height:1.14;font-weight:600;letter-spacing:-.012em;text-wrap:balance;outline:none}
html[lang="ar"] h1.q{line-height:1.4;letter-spacing:0}
.hint{margin:0 0 26px;color:var(--lav);font-size:17px}
.req-dot{display:none;margin-inline-start:8px;font-size:13px;font-weight:600;color:var(--lav);vertical-align:middle;border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.q+.opts,.q+.scale,.q+.inp,.q+.irs,.q+.cf{margin-top:26px}

/* Options */
.opts{display:grid;gap:10px}
.opts.cols{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.opts.cols{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-width:0;text-align:start;padding:15px 18px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--glass);cursor:pointer;font-weight:500;line-height:1.3;
  transition:background .18s,border-color .18s,color .18s,transform .18s var(--ease)}
.opt:hover{background:var(--glass-hover);transform:translateY(-1px)}
.opt:active{transform:scale(.99)}
.opt .key{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--lav);transition:all .18s}
@media (hover:none){.opt .key{display:none}}
.opt .lbl{flex:1;min-width:0;overflow-wrap:anywhere}
.opt small{display:block;margin-top:2px;font-size:13.5px;font-weight:400;opacity:.78}
.opt .tick{flex:none;width:22px;height:22px;opacity:0;transform:scale(.5);transition:all .22s var(--ease)}
.opt[aria-checked="true"]{background:#fff;border-color:#fff;color:var(--brand)}
.opt[aria-checked="true"] .key{background:var(--brand);border-color:var(--brand);color:#fff}
.opt[aria-checked="true"] .tick{opacity:1;transform:none}
.opt.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* Scales */
.scale{display:grid;gap:8px}
.sc{display:grid;place-items:center;aspect-ratio:1;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--glass);cursor:pointer;
  font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .18s,transform .18s var(--ease),color .18s}
.sc:hover{background:var(--glass-hover);transform:translateY(-2px)}
.sc[aria-checked="true"]{background:#fff;color:var(--brand);border-color:#fff;transform:translateY(-2px)}
.scale.n10{grid-template-columns:repeat(10,minmax(0,1fr))}
.scale.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
.scale.n11{grid-template-columns:repeat(11,minmax(0,1fr))}
@media (max-width:560px){.scale.n10{grid-template-columns:repeat(5,minmax(0,1fr))}.scale.n11{grid-template-columns:repeat(6,minmax(0,1fr))}}
.sc.lab{aspect-ratio:auto;padding:14px 4px 12px;gap:6px;align-content:start}
.sc.lab span{font-size:12.5px;font-weight:500;line-height:1.2;text-align:center;opacity:.9}
.ends{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:14px;color:var(--lav)}

/* Inputs */
.inp{width:100%;padding:15px 18px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.08);color:#fff;transition:border-color .18s,background .18s;resize:vertical}
.inp::placeholder{color:rgba(255,255,255,.55)}
.inp:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.15)}
.inp.other{margin-top:10px;animation:inFwd .3s var(--ease) both}
textarea.inp{min-height:130px}
.cf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.cf{grid-template-columns:1fr}}
.cf label{display:grid;gap:6px;font-size:14px;color:var(--lav);font-weight:500}
.cf .wide{grid-column:1/-1}
.pot{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.sub-h{margin:26px 0 12px;font-size:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--lav)}
html[lang="ar"] .sub-h{letter-spacing:0;text-transform:none;font-size:15px}
.err{margin-top:14px;padding:12px 16px;border-radius:12px;background:rgba(255,120,120,.16);border:1px solid rgba(255,150,150,.5);font-size:15px}

/* Per-product reasons */
.irs{display:grid;gap:10px}
.ir{display:grid;gap:8px}
.reasons{display:flex;flex-wrap:wrap;gap:8px;padding-inline-start:14px;animation:inFwd .3s var(--ease) both}
.rs{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 15px;font-size:15px;font-weight:500;cursor:pointer;transition:all .18s}
.rs:hover{background:var(--glass-hover)}
.rs[aria-checked="true"]{background:var(--lav);color:var(--brand-deep);border-color:var(--lav)}

/* Dock */
.dock{position:fixed;bottom:0;inset-inline:0;z-index:20;padding:34px var(--gutter) calc(16px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,rgba(36,0,88,.96) 52%,rgba(36,0,88,0))}
.dock-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.dock-hint{flex:1;text-align:center;font-size:14px;color:var(--lav);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 28px;border-radius:12px;border:0;background:#fff;color:var(--brand);
  font-weight:600;cursor:pointer;transition:transform .18s var(--ease),opacity .2s,box-shadow .2s;box-shadow:0 8px 24px rgba(20,0,60,.35)}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--glass-hover)}
.btn.round{width:50px;height:50px;padding:0;border-radius:50%;flex:none}
.btn.wide{width:100%}
.ico{width:20px;height:20px;flex:none}
[dir="rtl"] .ico.flip{transform:scaleX(-1)}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(68,0,153,.25);border-top-color:var(--brand);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Intro / end screens */
.hero h1{margin:14px 0 18px;font-size:clamp(34px,6.4vw,62px);line-height:1.04;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
html[lang="ar"] .hero h1{line-height:1.3;letter-spacing:0}
.hero .lead{font-size:clamp(18px,2.4vw,21px);color:#efe7ff;max-width:36em;margin:0 0 14px}
.hero .about{font-size:15.5px;color:var(--lav);max-width:42em;margin:0 0 22px}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 28px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14.5px;font-weight:500}
.pill svg{width:16px;height:16px}
.card{background:rgba(255,255,255,.1);border:1.5px solid var(--line);border-radius:18px;padding:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card h2{margin:0 0 6px;font-size:15px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--lav)}
html[lang="ar"] .card h2{letter-spacing:0;text-transform:none;font-size:16px}
.card p{margin:0 0 18px}
.stack{display:grid;gap:10px}
.note{margin:18px 0 0;font-size:14.5px;color:var(--lav)}
.done{text-align:center}
.done .ring{width:104px;height:104px;margin:0 auto 22px}
.ring circle{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:302;stroke-dashoffset:302;animation:draw .9s .1s var(--ease) forwards;transform-origin:center;transform:rotate(-90deg)}
.ring path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw2 .5s .8s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes draw2{to{stroke-dashoffset:0}}
.done h1{margin:0 0 10px;font-size:clamp(34px,6vw,52px);font-weight:700}
.done p{margin:0 auto 12px;max-width:30em;color:#efe7ff;font-size:19px}
.done .btn{margin-top:14px}
details.dbg{margin-top:26px;text-align:start;font-size:13px;color:var(--lav)}
details.dbg pre{max-height:240px;overflow:auto;background:rgba(0,0,0,.25);padding:14px;border-radius:12px;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word}

/* Toast */
.toast{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100vw - 32px);z-index:40;
  background:#fff;color:var(--brand);padding:10px 20px;border-radius:999px;font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(20,0,60,.4);
  animation:toast 2.4s var(--ease) both;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translateY(-14px)}12%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}

@media (max-width:560px){
  body{font-size:16px}
  .opt{padding:14px 15px}
  .btn{padding:14px 22px}
  .tools .tl{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}
}
</style>
</head>

/* ---------- Text helpers ---------- */
function u(k,vars){
  var s = UI[state.lang][k]; if(s==null) s = UI.en[k]; s = String(s);
  if(vars) Object.keys(vars).forEach(function(v){ s = s.replace('{'+v+'}', vars[v]); });

}
function L(o){ return o==null ? '' : (typeof o==='string' ? o : (o[state.lang]||o.en)); }
function qText(q){ var alt = q.qf && q.qf(state.a); return L(alt||q.q); }
function qOpts(q){ var alt = q.optsf && q.optsf(state.a); return alt||q.opts||[]; }
function secLabel(sec){
  var S = UI[state.lang].sec;

  return S[sec];
}

/* ---------- Validation ---------- */
function hasAnswer(q){
  var a = state.a, v = a[q.id];
  switch(q.type){
    case 'single': return !!v;
    case 'multi': return Array.isArray(v) && v.length>0;
    case 'scale': return typeof v==='number';
    case 'text': return !!(v && String(v).trim());
    case 'items': return !!a.unhappy_all || (a.unhappy && Object.keys(a.unhappy).length>0);
    case 'contact': return true;
  }
  return false;
}
function emailOk(s){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s); }
function validMsg(q){
  var a=state.a;
  if(q.type==='items' && a.unhappy && !a.unhappy_all){
    var missing = Object.keys(a.unhappy).some(function(k){return !a.unhappy[k]});
    if(missing) return u('pickReason');
  }
  if(q.type==='contact'){
    var c=state.contact;
    if(c.email && !emailOk(c.email.trim())) return u('emailBad');
    if(c.prefs.length && c.prefs.indexOf('none')<0 && !(c.email.trim()||c.phone.trim())) return u('contactNeed');
  }
  return '';
}
function canProceed(q){
  if(validMsg(q)) return false;
  return q.req ? hasAnswer(q) : true;
}

function field(id,label,type,val,ac){
  return '<label>'+esc(label)+'<input class="inp" data-f="'+id+'" type="'+type+'" maxlength="120" autocomplete="'+ac+'" value="'+esc(val||'')+'"'+(type==='tel'?' inputmode="tel" dir="ltr"':'')+(type==='email'?' inputmode="email" dir="ltr"':'')+'></label>';

/* ---------- Chrome (progress, dock, time) ---------- */
function chrome(){
  var q = state.screen==='q' ? curQ() : null;
  var dock = $('#dock');
  dock.hidden = !q;
  var bar = $('#bar'), tl = $('#timeLeft');
  if(!q){
    bar.style.width = state.screen==='done' ? '100%' : '0%';
    tl.textContent = '';
    return;
  }
  var V = visibleQs(), idx = V.indexOf(q);
  bar.style.width = Math.max(3, Math.round((idx/V.length)*100)) + '%';
  var secs = 0; for(var i=idx;i<V.length;i++) secs += WEIGHT[V[i].type]||8;
  tl.textContent = secs>75 ? u('minLeft',{n:Math.round(secs/60)||1}) : u('lessMin');
  updateDock();
  if(state.lastSec!==null && state.lastSec!==q.sec){ var chip=$('#chip'); if(chip) chip.classList.add('flash'); }
  state.lastSec = q.sec;
  if(!state.halfShown && idx>=Math.floor(V.length/2) && idx>2){ state.halfShown=true; toast(u('halfway')); }
  if(idx===V.length-1) { /* last step cue */ var h=$('#chip'); if(h) h.textContent = secLabel(q.sec)+' · '+u('lastStep'); }
}
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg; t.setAttribute('role','status');
  document.body.appendChild(t); setTimeout(function(){t.remove()},2500);
}
function updateDock(){
  var q = curQ(); if(!q) return;
  var V = visibleQs(), last = V.indexOf(q)===V.length-1;
  var btn = $('#nextBtn'), hint = $('#dockHint'), a = state.a;
  var answered = hasAnswer(q) && !(q.type==='contact');
  var ok = canProceed(q);
  var label;
  if(state.sending){ btn.innerHTML = '<span class="spinner"></span>'+esc(u('sending')); btn.disabled = true; return; }
  if(last) label = u('submit');
  else if(answered) label = u('next');
  else label = q.req ? u('next') : u('skip');
  btn.innerHTML = esc(label) + (last?'':ICON_ARROW);
  btn.disabled = !ok;
  var h='';
  if(q.type==='multi' && q.max && q.max<9){ var n=(Array.isArray(a[q.id])?a[q.id].length:0); h = n? u('selected',{x:n,n:q.max}) : ''; }
  if(q.type==='items' || q.type==='contact'){ h = validMsg(q); }
  if(!ok && !h){ h = u('answerFirst'); }
  hint.textContent = h;
}

/* ---------- Navigation ---------- */
function startSurvey(fromResume){
  var V = visibleQs();
  if(fromResume && state._resume && V.some(function(q){return q.id===state._resume})) state.cur = state._resume;
  else { state.cur = V[0].id; if(!fromResume){ state.a={}; state.contact={name:'',entity:'',email:'',phone:'',account:'',f5:'',prefs:[]}; state.startedAt=Date.now(); state.halfShown=false; } }
  state.screen='q'; state.lastSec=null; state.submitError=false;
  render('fwd'); focusStage();
}
function next(){
  clearTimeout(advTimer);
  var q=curQ(); if(!q || !canProceed(q)) return;
  var V=visibleQs(), i=V.indexOf(q);
  if(i<V.length-1){ state.cur=V[i+1].id; render('fwd'); focusStage(); }
  else submit();
}
function back(){
  clearTimeout(advTimer);
  var V=visibleQs(), i=V.indexOf(curQ());
  if(i>0){ state.cur=V[i-1].id; render('back'); focusStage(); }
  else { state.screen='intro'; render('back'); }
}
function focusStage(){
  var q=curQ(); if(!q) return;
  var t = q.type==='text' ? $('#txt') : null;
  var el = t || $('#qh');
  if(el) setTimeout(function(){ try{ el.focus({preventScroll:true}); }catch(e){} }, 60);
  window.scrollTo({top:0,behavior:'auto'});
}
function repaint(focusSel){
  setAnim('none'); renderQ(); chrome(); save();
  if(focusSel){ var el=screenEl.querySelector(focusSel); if(el){ try{el.focus({preventScroll:true})}catch(e){} } }
}
function scheduleAdvance(){
  clearTimeout(advTimer);
  advTimer = setTimeout(next, 340);
}

/* ---------- Answer handling ---------- */
function findOpt(q,v){ return qOpts(q).filter(function(o){return o.v===v})[0]; }

screenEl.addEventListener('click',function(e){
  var t = e.target;
  var b = t.closest('button'); if(!b) return;
  if(b.id==='agree'){ startSurvey(false); return; }
  if(b.id==='resume'){ startSurvey(true); return; }
  if(b.id==='disagree'){ state.screen='declined'; render('fwd'); return; }
  if(b.id==='startOver'){ state.screen='intro'; render('back'); return; }
  if(b.id==='share'){ copyLink(b); return; }
  var q = curQ(); if(!q || state.screen!=='q') return;
  clearTimeout(advTimer);

  if(q.type==='single' && b.classList.contains('opt')){
    var v = b.dataset.v, o = findOpt(q,v);
    state.a[q.id] = v;
    if(!o.other) delete state.a[q.id+'_other'];
    repaint('[data-v="'+cssEsc(v)+'"]');
    if(o.other){ var oi=$('#oth'); if(oi) oi.focus({preventScroll:true}); } else if(!q.noAuto) scheduleAdvance();
  }
  else if(q.type==='multi' && b.classList.contains('opt')){
    var val = b.dataset.v, o2 = findOpt(q,val), arr = Array.isArray(state.a[q.id]) ? state.a[q.id].slice() : [];
    var at = arr.indexOf(val);
    if(at>=0){ arr.splice(at,1); if(o2.other) delete state.a[q.id+'_other']; }
    else {
      if(o2.exclusive){ arr = []; delete state.a[q.id+'_other']; }
      else { arr = arr.filter(function(x){ var ox=findOpt(q,x); return !(ox&&ox.exclusive); }); }
      var cap = q.max;
      if(cap && cap<9 && arr.length>=cap && !o2.exclusive){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
      arr.push(val);
    }
    if(arr.length) state.a[q.id]=arr; else delete state.a[q.id];
    repaint('[data-v="'+cssEsc(val)+'"]');
    if(at<0 && o2.other){ var oi2=$('#oth'); if(oi2) oi2.focus({preventScroll:true}); }
  }
  else if(q.type==='scale' && b.classList.contains('sc')){
    state.a[q.id] = parseInt(b.dataset.n,10);
    repaint('[data-n="'+b.dataset.n+'"]');
    scheduleAdvance();
  }
  else if(q.type==='items'){
    var a = state.a;
    if(b.dataset.all){
      a.unhappy_all = !a.unhappy_all; if(a.unhappy_all) a.unhappy = {};
      repaint('[data-all="1"]'); return;
    }
    if(b.dataset.pick){
      a.unhappy = a.unhappy || {}; a.unhappy_all = false;
      if(Object.prototype.hasOwnProperty.call(a.unhappy,b.dataset.v)) delete a.unhappy[b.dataset.v]; else a.unhappy[b.dataset.v] = '';
      repaint('[data-v="'+cssEsc(b.dataset.v)+'"]'); return;
    }
    if(b.dataset.r){
      a.unhappy[b.dataset.pid] = b.dataset.r;
      repaint('[data-pid="'+cssEsc(b.dataset.pid)+'"][data-r="'+cssEsc(b.dataset.r)+'"]'); return;
    }
  }
  else if(q.type==='contact' && b.dataset.pref){
    var p = state.contact.prefs, k = p.indexOf(b.dataset.v);
    if(k>=0) p.splice(k,1);
    else if(b.dataset.v==='none') p.length = 0, p.push('none');
    else { var ni = p.indexOf('none'); if(ni>=0) p.splice(ni,1); p.push(b.dataset.v); }
    repaint('[data-v="'+cssEsc(b.dataset.v)+'"]');
  }
});
function cssEsc(s){ return String(s).replace(/(["\\\]])/g,'\\$1'); }

screenEl.addEventListener('input',function(e){
  var t=e.target, q=curQ(); if(!q) return;
  if(t.id==='oth'){ state.a[q.id+'_other']=t.value; save(); }
  else if(t.id==='exact'){
    var digits = t.value.replace(/\D/g,''); if(digits!==t.value) t.value = digits;
    if(digits){
      var n = parseInt(digits,10);
      state.a[q.id+'_exact'] = digits;
      state.a[q.id] = n<=1 ? '1' : (n<=3 ? '2-3' : (n<=9 ? '4-9' : (n<=24 ? '10-24' : (n<=99 ? '25-99' : '100+'))));
    } else delete state.a[q.id+'_exact'];
    Array.prototype.forEach.call(screenEl.querySelectorAll('.opt[data-v]'),function(el){ el.setAttribute('aria-checked', String(state.a[q.id]===el.dataset.v)); });
    updateDock(); save();
  }
  else if(t.id==='txt'){ state.a[q.id]=t.value; updateDock(); save(); }
  else if(t.id==='note'){ state.a.unhappy_note=t.value; save(); }
  else if(t.dataset && t.dataset.f){
    state.contact[t.dataset.f]=t.value; updateDock();
    var msg=validMsg(q), box=$('#cerr'); if(box){ box.hidden=!msg; box.textContent=msg; }
    save();
  }
});

$('#nextBtn').addEventListener('click',next);
$('#backBtn').addEventListener('click',back);
$('#langBtn').addEventListener('click',function(){ state.lang = state.lang==='ar'?'en':'ar'; render('none'); });

document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var tag=(e.target.tagName||'').toLowerCase();
  var typing = tag==='input'||tag==='textarea';
  if(state.screen!=='q'){ return; }
  var q=curQ(); if(!q) return;
  if(e.key==='Enter'){
    if(tag==='textarea' && !e.shiftKey && q.type!=='text') return;
    if(tag==='textarea' && q.type==='text' && e.shiftKey) return;
    if(tag==='button' && e.target.id!=='nextBtn') { /* let buttons activate normally */ return; }
    if(q.type==='contact' && tag!=='input') return;
    e.preventDefault(); next(); return;
  }
  if(typing) return;
  if(q.type==='single' || q.type==='multi'){
    var i = LETTERS.indexOf(e.key.toUpperCase());
    var opts = qOpts(q);
    if(e.key.length===1 && i>=0 && i<opts.length){
      var el = screenEl.querySelector('[data-v="'+cssEsc(opts[i].v)+'"]'); if(el){ e.preventDefault(); el.click(); }
    }
  }
  if(q.type==='scale' && /^[0-9]$/.test(e.key)){
    var n = q.smin===0 ? parseInt(e.key,10) : (e.key==='0' ? 10 : parseInt(e.key,10));
    var el2 = screenEl.querySelector('[data-n="'+n+'"]'); if(el2){ el2.click(); }
  }
});

/* ---------- Submit ---------- */
function buildPayload(){
  var V = visibleQs(), keep = {}, a = state.a, out = {};
  V.forEach(function(q){ keep[q.id]=1; keep[q.id+'_other']=1; keep[q.id+'_exact']=1; if(q.type==='items'){ keep.unhappy=1; keep.unhappy_all=1; keep.unhappy_note=1; } });
  Object.keys(a).forEach(function(k){ if(keep[k] && k!=='contact'){ var v=a[k]; if(v!==''&&v!=null) out[k]=v; } });
  out._shown = V.map(function(q){ return q.id; }).filter(function(id){ return id!=='contact'; });   /* which questions this merchant was shown, so skips can be seen */
  var c = state.contact;
  var contact = {};
  if(c.prefs.indexOf('none')<0){
    if(c.name.trim()) contact.name=c.name.trim();
    if(c.entity.trim()) contact.entity=c.entity.trim();
    if(c.email.trim()) contact.email=c.email.trim();
    if(c.phone.trim()) contact.phone=c.phone.trim();
    if(c.account.trim() && hist(a)) contact.foodics_account=c.account.trim();
    if(c.f5.trim() && hist(a)) contact.f5_id=c.f5.trim();
  }
  if(c.prefs.length) contact.prefs=c.prefs.slice();
  var src=''; try{ src = new URLSearchParams(location.search).get('src')||''; }catch(e){}
  return {
    survey_version:VERSION, language:state.lang, consent:true,
    is_customer: a.isCustomer==='yes',
    duration_seconds: Math.min(7200, Math.round((Date.now()-state.startedAt)/1000)),
    source: src.slice(0,60)||null,
    answers: out, contact: contact
  };
}
function submit(){
  if(state.sending) return;
  var q = curQ(); if(q && !canProceed(q)) return;
  var pot = $('#pot'); var isBot = pot && pot.value;
  var payload = buildPayload();
  state.sending = true; state.submitError=false; updateDock();
  var finish = function(){
    state.sending=false; state.submittedPrefs = payload.contact.prefs||[]; state.lastPayload=payload;
    state.screen='done'; try{localStorage.removeItem(STORE_KEY)}catch(e){}
    render('fwd'); window.scrollTo({top:0});
  };
  if(isBot){ finish(); return; }
  if(!CONFIGURED){ setTimeout(finish,600); return; }
  var headers = {'Content-Type':'application/json','apikey':CFG.SUPABASE_ANON_KEY,'Prefer':'return=minimal'};
  if(String(CFG.SUPABASE_ANON_KEY).indexOf('eyJ')===0) headers['Authorization']='Bearer '+CFG.SUPABASE_ANON_KEY;
  fetch(CFG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+CFG.TABLE,{method:'POST',headers:headers,body:JSON.stringify(payload)})
   .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); finish(); })
   .catch(function(err){ console.error('Submit failed',err); state.sending=false; state.submitError=true; renderQ(); chrome(); });
}
function copyLink(btn){
  var url = location.href.split('#')[0].split('?')[0];
  var done = function(){ var old=btn.textContent; btn.textContent=u('copied'); setTimeout(function(){btn.textContent=old},1800); };
  try{ navigator.clipboard.writeText(url).then(done,function(){}); }catch(e){}
}

/* ---------- Boot ---------- */
load();
render('none');
window.__survey = {state:state,visibleQs:visibleQs,QUESTIONS:QUESTIONS,buildPayload:buildPayload,
  go:function(id){ state.screen='q'; state.cur=id; render('none'); }};
})();
</script>
